# Production Database Connection Configuratispring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Connection Pool Tuning (Render free-tier)
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.keepalive-time=60000

# Production Optimisations
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Production Security/Routing URL Mappings
app.frontend.url=${FRONTEND_URL:https://vyg-front-end.onrender.com}
app.cors.allowed-origins=https://vyg-front-end.onrender.com

# Diagnostic Filters for Render Logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Suppress verbose security/CORS logs in production
logging.level.com.vyg.config=INFO
logging.level.com.vyg.config.security=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.cors=WARN
logging.level.org.springframework.web.filter.CorsFilter=WARN
logging.level.org.springframework.web.servlet.handler.HandlerMappingIntrospector=WARN
