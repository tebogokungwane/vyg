spring.application.name=victory-youth-group

# Default active profile if nothing is specified externally
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA Default Behavior
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Server - Dynamic port mapping for local/cloud environments
server.port=${PORT:2025}

upload.dir=./uploads

# JWT Local Default (Fallback fallback)
jwt.secret=${JWT_SECRET:VYG_SECRET_KEY_12345678901234567890_CHANGE_IN_PROD}

# Mail Configuration (Brevo SMTP)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=aeba67001@smtp-brevo.com
spring.mail.password=0hy87Fr4qMT1HUds
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS & Security Debug Logs
logging.level.com.vyg.config=DEBUG
logging.level.com.vyg.config.security=DEBUG
logging.level.org.springframework.security=DEBUG
