databaseChangeLog:
  - changeSet:
      id: 002-load-school-institution-data
      author: vyg-system
      comment: Load school institution data from CSV file
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: school_institution
      changes:
