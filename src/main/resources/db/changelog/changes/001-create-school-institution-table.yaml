databaseChangeLog:
  - changeSet:
      id: 001-create-school-institution-table
      author: vyg-system
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: school_institution
      changes:
        - createTable:
            tableName: school_institution
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nat_emis
                  type: BIGINT
                  constraints:
                    unique: true
              - column:
                  name: data_year
                  type: INT
              - column:
                  name: province
                  type: VARCHAR(50)
              - column:
                  name: official_institution_name
                  type: VARCHAR(500)
              - column:
                  name: status
                  type: VARCHAR(50)
              - column:
                  name: sector
                  type: VARCHAR(50)
              - column:
                  name: type_doe
                  type: VARCHAR(100)
              - column:
                  name: phase_ped
                  type: VARCHAR(100)
              - column:
                  name: specialisation
                  type: VARCHAR(100)
              - column:
                  name: ei_district
                  type: VARCHAR(100)
              - column:
                  name: ei_circuit
                  type: VARCHAR(100)
              - column:
                  name: owner_land
                  type: VARCHAR(100)
              - column:
                  name: owner_build
                  type: VARCHAR(100)
              - column:
                  name: ex_dept
                  type: VARCHAR(200)
              - column:
                  name: persal_paypoint_no
                  type: VARCHAR(50)
              - column:
                  name: persal_component_no
                  type: VARCHAR(50)
              - column:
                  name: exam_no
                  type: VARCHAR(50)
              - column:
                  name: exam_centre
                  type: VARCHAR(200)
              - column:
                  name: gis_longitude
                  type: DOUBLE
              - column:
                  name: gis_latitude
                  type: DOUBLE
              - column:
                  name: district_municipality_name
                  type: VARCHAR(500)
              - column:
                  name: local_municipality_name
                  type: VARCHAR(500)
              - column:
                  name: ward_id
                  type: VARCHAR(50)
              - column:
                  name: sp_code
                  type: VARCHAR(50)
              - column:
                  name: sp_name
                  type: VARCHAR(200)
              - column:
                  name: addressee
                  type: VARCHAR(500)
              - column:
                  name: township_village
                  type: VARCHAR(200)
              - column:
                  name: suburb
                  type: VARCHAR(200)
              - column:
                  name: town_city
                  type: VARCHAR(200)
              - column:
                  name: street_address
                  type: VARCHAR(1000)
              - column:
                  name: postal_address
                  type: VARCHAR(500)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: telephone
                  type: VARCHAR(100)
              - column:
                  name: section21
                  type: VARCHAR(10)
              - column:
                  name: section21_function
                  type: VARCHAR(50)
              - column:
                  name: quintile
                  type: VARCHAR(20)
              - column:
                  name: nas
                  type: VARCHAR(100)
              - column:
                  name: nodal_area
                  type: VARCHAR(100)
              - column:
                  name: registration_date
                  type: VARCHAR(100)
              - column:
                  name: no_fee_school
                  type: VARCHAR(10)
              - column:
                  name: urban_rural
                  type: VARCHAR(20)
              - column:
                  name: allocation
                  type: VARCHAR(50)
              - column:
                  name: demarcation_from
                  type: VARCHAR(50)
              - column:
                  name: demarcation_to
                  type: VARCHAR(50)
              - column:
                  name: old_nat_emis
                  type: VARCHAR(50)
              - column:
                  name: new_nat_emis
                  type: VARCHAR(50)
              - column:
                  name: learners2025
                  type: INT
              - column:
                  name: educators2025
                  type: INT

        - createIndex:
            indexName: idx_school_inst_nat_emis
            tableName: school_institution
            columns:
              - column:
                  name: nat_emis

        - createIndex:
            indexName: idx_school_inst_province
            tableName: school_institution
            columns:
              - column:
                  name: province

        - createIndex:
            indexName: idx_school_inst_name
            tableName: school_institution
            columns:
              - column:
                  name: official_institution_name

        - createIndex:
            indexName: idx_school_inst_district
            tableName: school_institution
            columns:
              - column:
                  name: ei_district

        - createIndex:
            indexName: idx_school_inst_phase
            tableName: school_institution
            columns:
              - column:
                  name: phase_ped

        - createIndex:
            indexName: idx_school_inst_urban_rural
            tableName: school_institution
            columns:
              - column:
                  name: urban_rural
